name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/rusty-brick-chess/src-tauri -> target
            apps/rusty-brick-chess/frontend -> target

      - name: Install frontend tooling
        uses: taiki-e/install-action@cargo-binstall

      - name: Install cargo-leptos and wasm-bindgen
        shell: bash
        run: |
          cargo binstall -y cargo-leptos
          # wasm-bindgen-cli must match the wasm-bindgen crate in frontend/Cargo.lock
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' apps/rusty-brick-chess/frontend/Cargo.lock \
            | grep '^version' | head -1 | cut -d '"' -f2)
          cargo binstall -y "wasm-bindgen-cli@${VERSION}" \
            || cargo install wasm-bindgen-cli --version "${VERSION}" --locked

      - name: Build frontend
        shell: bash
        run: |
          cd apps/rusty-brick-chess/frontend
          ./deploy.sh

      # The official Stockfish build for this OS, checked against a pinned sha256 and smoke-tested
      # (it must answer `uci`), placed in src-tauri/bundled-engine/ which Tauri bundles as
      # engine/. "universal" = one binary that picks the best CPU instruction set at start, so
      # it runs on every x86-64 CPU. See scripts/fetch_bundled_stockfish.sh.
      - name: Bundle Stockfish
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            ubuntu-*) os=linux ;;
            macos-*) os=macos ;;
            windows-*) os=windows ;;
          esac
          scripts/fetch_bundled_stockfish.sh "$os"
          engine=apps/rusty-brick-chess/src-tauri/bundled-engine/stockfish
          [ "$os" = windows ] && engine="$engine.exe"
          reply="$(printf 'uci\nquit\n' | timeout 60 "$engine")"
          echo "$reply" | head -5
          echo "$reply" | grep -q '^uciok'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/rusty-brick-chess
          tagName: ${{ github.ref_name }}
          releaseName: "RustyBrickChess ${{ github.ref_name }}"
          releaseBody: |
            RustyBrickChess desktop pre-alpha for Linux and Windows (no macOS build yet:
            GitHub has not assigned a macOS runner; build from source on a Mac). A tag with
            a `-` in it (for example `v0.1.0-prealpha.1`) is published as a pre-release.

            **Install**
            - Windows: run the `.exe` (or the `.msi`).
            - Linux: `chmod +x` the `.AppImage` and run it, or install the `.deb` / `.rpm`.

            Then open the app, choose **Play AI**, pick a colour and press **Start**.
            The built-in test bot (random moves, no model) works immediately. The installers
            include the official Stockfish 19 (GPL-3.0) for analysis; no setup is needed.

            **Honest limits**
            - These installers are **not code-signed**. Windows SmartScreen
              will warn; choose "More info > Run anyway".
            - Only Linux has been run by hand. The Windows installer comes from CI and has
              not been installed by a person yet (RBCUI-LIB-09 is still open).
            - Playing the real KnightLM model is opt-in: "Get the model" downloads about
              1.4 GB once (a private Python, the Python packages and the model weights,
              every piece checksum-verified). You do not need to install Python. The model
              plays at about random strength and does not chat yet; the test bot does.
            - Pre-alpha: expect rough edges. Nothing here is a strength claim.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
