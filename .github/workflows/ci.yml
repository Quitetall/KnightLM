name: scaffold
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      # The frontend only compiles for wasm; clippy on the host target would lint
      # code that never ships.
      - run: rustup target add wasm32-unknown-unknown
      - name: Install Stockfish for the UCI smoke test
        run: |
          timeout 120 sudo apt-get update
          timeout 120 sudo apt-get install -y --no-install-recommends stockfish
      - run: make check
        env:
          STOCKFISH_PATH: /usr/games/stockfish
      # `make check` never sees `apps/`: the server and wasm frontend crates are
      # excluded from the workspace, so their lints and tests need this step.
      # The app's seam test (apps/rusty-brick-chess/tests/knightlm_seam.rs) drives the real routes
      # against the real serving app over a fake predictor (python -m model.serve.fake_server):
      # fastapi, uvicorn and httpx only, no torch. In CI a missing server is a failure, not a skip.
      - name: Python for the fake KnightLM server
        run: |
          python3 -m venv "$RUNNER_TEMP/seam-venv"
          timeout 600 "$RUNNER_TEMP/seam-venv/bin/pip" install --no-cache-dir \
            fastapi==0.115.12 uvicorn==0.34.2 httpx==0.28.1
      - run: make check-apps
        env:
          KNIGHTLM_FAKE_SERVER_PYTHON: ${{ runner.temp }}/seam-venv/bin/python
          RBC_REQUIRE_FAKE_SERVER: "1"
  # The torch-dependent model tests skip when torch is missing, which `make check` only
  # lists. Here CPU-only torch (official PyTorch CPU wheel index), pillow, transformers
  # and peft are installed from pinned versions, so a skip for a missing dependency
  # or an unbuilt binary fails the job.
  model-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup update stable && rustup default stable
      - run: cargo build --locked -j 2
      - name: Stockfish for the knightlm-uci game gate
        run: |
          timeout 120 sudo apt-get update
          timeout 120 sudo apt-get install -y --no-install-recommends stockfish
      - run: python3 -m venv "$RUNNER_TEMP/venv"
      - run: >
          timeout 900 "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir
          --extra-index-url https://download.pytorch.org/whl/cpu
          -r model/ci-requirements.txt
      - run: make check-torch PYTHON="$RUNNER_TEMP/venv/bin/python" FORBID_SKIP='torch|transformers|peft|Pillow|numpy|fastapi|httpx|openai|not built|not installed'
        env:
          STOCKFISH_PATH: /usr/games/stockfish
  # The Tauri desktop shell: lint it, build it, launch it under a virtual display
  # and check the window, the per-launch token, single-instance and shutdown.
  desktop-shell:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - name: Tauri system libraries, virtual display and Stockfish
        run: |
          timeout 120 sudo apt-get update
          timeout 300 sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb xdotool imagemagick curl stockfish
      - run: make check-desktop
  mojo-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup update stable && rustup default stable
      - run: cargo build --locked -j 2
      - run: python3 -m venv model/parity/mojo/.venv
      - run: model/parity/mojo/.venv/bin/pip install -r model/parity/mojo/requirements.txt
      - run: python3 scripts/check_ports.py --require-mojo
  secret-scan:
    name: secret-scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
