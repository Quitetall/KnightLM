[workspace]
members = ["crates/core", "crates/model", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cozy-chess = { version = "=0.3.4", features = ["std"] }
burn = { version = "=0.21.0", default-features = false, features = ["std", "ndarray", "autodiff"] }
