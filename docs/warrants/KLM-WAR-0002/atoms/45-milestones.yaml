schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "SAN engine round-trips the fixture battery"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M2"
    title: "Thin reader ingests a real month-file excerpt"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-003"]

  - id: "M3"
    title: "Detection seam, CLI, and the consumer check"
    depends_on: ["M2"]
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-004"]

stages:
  - id: "STAGE-001"
    title: "build the SAN engine and its round-trip battery"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "build the thin reader and run it on a real excerpt"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-003"
    title: "wire the detection seam and CLI; hand to the consumer"
    executor_kind: "agent"
    responsibility_tier: "T2"
