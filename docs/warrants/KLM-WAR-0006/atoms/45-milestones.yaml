schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "UCI handshake and the scripted game"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001", "OBL-002"]

  - id: "M2"
    title: "Random-legal legality over many games"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-003"]

  - id: "M3"
    title: "Consumer check: a real UCI driver plays it"
    depends_on: ["M2"]
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-004"]

stages:
  - id: "STAGE-001"
    title: "implement the UCI side and the driver"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "property-test the RandomLegal player"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-003"
    title: "run the consumer-driver session"
    executor_kind: "agent"
    responsibility_tier: "T2"
