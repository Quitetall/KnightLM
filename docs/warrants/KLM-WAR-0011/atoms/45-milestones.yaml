schema: "oh.war/milestones/v1"

milestones:
  - id: "M1"
    title: "Burn env green; study published"
    stage_refs: ["STAGE-001"]
    obligation_refs: ["OBL-001"]

  - id: "M2"
    title: "Parity skeleton honest-red"
    depends_on: ["M1"]
    stage_refs: ["STAGE-002"]
    obligation_refs: ["OBL-002", "OBL-003"]

  - id: "M3"
    title: "Next-implementer handoff check"
    depends_on: ["M2"]
    stage_refs: ["STAGE-003"]
    obligation_refs: ["OBL-004"]

stages:
  - id: "STAGE-001"
    title: "burn bring-up + architecture study"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-002"
    title: "parity skeleton + fake-green refusal test"
    executor_kind: "agent"
    responsibility_tier: "T2"

  - id: "STAGE-003"
    title: "hand study + skeleton to the next implementer"
    executor_kind: "agent"
    responsibility_tier: "T2"
