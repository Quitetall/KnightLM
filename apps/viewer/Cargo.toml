[workspace]

[[workspace.metadata.leptos]]
name = "knightlm-viewer"
lib-package = "knightlm-viewer"
bin-package = "knightlm-viewer"
bin-target = "knightlm-viewer"
bin-features = []
lib-features = []
site-root = "public"
site-pkg-dir = "pkg"

[package]
name = "knightlm-viewer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["PointerEvent", "MouseEvent", "Window", "Navigator", "Clipboard", "Element"] }
brick-chess = { path = "../../crates/brick-chess" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
