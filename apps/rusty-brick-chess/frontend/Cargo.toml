[workspace]

[[workspace.metadata.leptos]]
name = "rbc-frontend"
lib-package = "rbc-frontend"
bin-package = "rbc-frontend"
bin-target = "rbc-frontend"
site-root = "public"
site-pkg-dir = "pkg"

[package]
name = "rbc-frontend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["PointerEvent", "MouseEvent", "Window", "Navigator", "Clipboard", "Element", "HtmlElement", "HtmlDivElement", "DomRect", "CssStyleDeclaration", "EventTarget", "Document", "HtmlAudioElement", "HtmlMediaElement", "File", "FileList", "FileReader", "HtmlInputElement", "Blob", "Storage", "CustomEvent", "Event", "console", "DragEvent", "DataTransfer", "Url", "HtmlAnchorElement"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
brick-chess = { path = "../../../crates/brick-chess" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
