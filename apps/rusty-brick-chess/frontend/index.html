<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RustyBrickChess</title>
  <link rel="stylesheet" href="./pkg/rbc-frontend.css" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #141418;
      --panel: #1c1c22;
      --panel-2: #24242c;
      --line: #31313c;
      --text: #e9e9ee;
      --muted: #9a9aa8;
      --accent: #7fd18a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0; min-height: 100vh;
      background: radial-gradient(1200px 600px at 20% -10%, #1e2430 0%, var(--bg) 60%);
      color: var(--text);
      display: flex; justify-content: center;
      padding: 2rem 1.5rem;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 580px) 320px;
      gap: 1.6rem;
      align-items: start;
      width: 100%;
      max-width: 960px;
    }
    .board-col { min-width: 0; }
    .board-wrap { position: relative; outline: none; }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
      user-select: none;
      touch-action: none;
    }
    .board { user-select: none; }
    .sq {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      min-width: 0; min-height: 0;
      border: none; padding: 0; cursor: pointer; background-clip: padding-box;
      transition: filter .07s;
    }
    .sq:hover { filter: brightness(1.05); }
    .sq > svg { display: block; width: 100%; height: 100%; pointer-events: none; }

    .sq.dragging-src > svg { visibility: hidden; }
    .drag-ghost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; display: none; will-change: transform; transform: translate3d(0,0,0); backface-visibility: hidden; }
    .drag-ghost svg { display: block; width: 100%; height: 100%; }
    .board.green .sq.light { background: #eeeed2; }
    .board.green .sq.dark  { background: #769656; }
    .board.brown .sq.light { background: #f0d9b5; }
    .board.brown .sq.dark  { background: #b58863; }
    .board.custom .sq.light { background: var(--board-light, #eeeed2); }
    .board.custom .sq.dark  { background: var(--board-dark, #769656); }
    .board.blue  .sq.light { background: #e8eef7; }
    .board.blue  .sq.dark  { background: #6387ae; }

    .sq.last   { box-shadow: inset 0 0 0 4px rgba(246, 211, 45, .5); }
    .sq.dest   { box-shadow: inset 0 0 0 4px rgba(246, 211, 45, .75); }
    .sq.selected { box-shadow: inset 0 0 0 4px #f6d32d; }
    .sq.hovered  { box-shadow: inset 0 0 0 4px rgba(255,255,255,.65); }
    .sq.check { background-image: radial-gradient(circle, rgba(220,60,60,.85) 0%, rgba(220,60,60,.32) 46%, transparent 70%); }
    .board.animate-last .sq.dest > svg { animation: pop .16s ease-out; }
    @keyframes pop { 0% { transform: scale(1.14); } 100% { transform: scale(1); } }

    .sq.target::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: 28%; height: 28%; transform: translate(-50%, -50%);
      border-radius: 50%; background: rgba(15,20,15,.34); pointer-events: none;
    }
    .sq.capture::after {
      content: ""; position: absolute; inset: 5px;
      border: 6px solid rgba(15,20,15,.30); border-radius: 50%; pointer-events: none;
    }

    .coord {
      position: absolute; font-size: 10px; font-weight: 700;
      color: rgba(20,24,20,.5); pointer-events: none; line-height: 1;
    }
    .coord.rank { top: 3px; left: 4px; }
    .coord.file { bottom: 3px; right: 5px; }
    .board.brown .coord, .board.blue .coord { color: rgba(255,255,255,.55); }

    .ghost {
      position: fixed; width: 60px; height: 60px; pointer-events: none;
      z-index: 60; opacity: .96; filter: drop-shadow(0 8px 14px rgba(0,0,0,.55));
    }

    .promo-overlay {
      position: absolute; inset: 0; z-index: 70;
      background: rgba(8,8,12,.55); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
    }
    .promo-card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: .9rem 1rem; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.6);
    }
    .promo-title { font-size: .78rem; color: var(--muted); margin-bottom: .6rem; letter-spacing: .04em; }
    .promo-row { display: flex; gap: .5rem; }
    .promo-btn {
      width: 56px; height: 56px; padding: 0; border-radius: 8px;
      background: var(--panel-2); border: 1px solid var(--line); cursor: pointer;
    }
    .promo-btn:hover { background: #30303a; }
    .promo-btn svg { width: 100%; height: 100%; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      display: flex; flex-direction: column; gap: .85rem;
      box-shadow: 0 18px 50px rgba(0,0,0,.4);
    }
    .panel-title { font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; }
    .panel-sub { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

    .captured { display: flex; flex-direction: column; gap: .25rem; }
    .cap-row { display: flex; align-items: center; gap: .5rem; min-height: 24px; }
    .cap-side { font-size: .72rem; color: var(--muted); width: 5.5rem; }
    .cap { display: inline-block; width: 20px; height: 20px; vertical-align: middle; }
    .cap svg { width: 100%; height: 100%; }
    .cap-adv { font-size: .78rem; color: var(--muted); }
    .cap-adv b { color: var(--text); }

    .movelist { display: flex; flex-direction: column; gap: .35rem; }
    .moves {
      display: flex; flex-direction: column; gap: 1px;
      max-height: 220px; overflow-y: auto;
      background: var(--panel-2); border-radius: 8px; padding: .3rem;
    }
    .move-row {
      display: grid; grid-template-columns: 2rem 1fr 1fr; align-items: center;
      gap: .2rem; border-radius: 5px;
    }
    .move-row:nth-child(odd) { background: rgba(255,255,255,.02); }
    .move-no { font-size: .76rem; color: var(--muted); text-align: right; padding-right: .3rem; }
    .move {
      background: transparent; border: none; color: #d3d3dc;
      text-align: left; padding: .18rem .35rem; border-radius: 4px;
      font-family: ui-monospace, "SFMono-Regular", monospace; font-size: .8rem; cursor: pointer;
    }
    .move:hover { background: #31313c; }
    .move.current { background: #2f4a35; color: #d9f5df; }

    .controls { display: flex; gap: .4rem; flex-wrap: wrap; }
    .selects { display: flex; gap: .8rem; flex-wrap: wrap; }
    .selects label {
      display: flex; align-items: center; gap: .4rem;
      font-size: .76rem; color: var(--muted);
    }
    .selects select {
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 7px;
      padding: .35rem .5rem; font-size: .78rem; cursor: pointer;
    }
    .controls button, .load button, .pgn-box button {
      padding: .42rem .75rem; background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 7px; cursor: pointer; font-size: .82rem;
    }
    .controls button:hover, .load button:hover, .pgn-box button:hover { background: #30303a; }

    .load { display: flex; gap: .4rem; }
    .filters { display: flex; flex-wrap: wrap; gap: .5rem .7rem; align-items: flex-end; margin-top: .6rem; }
    .filters label { display: flex; flex-direction: column; gap: .2rem; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .filters input, .filters select { padding: .35rem .5rem; border-radius: 6px; background: #16161b; color: var(--text); border: 1px solid var(--line); font-size: .78rem; }
    .filters input[type="number"] { width: 7.2rem; }
    .filters button { padding: .38rem .7rem; background: #2a2a33; color: var(--text); border: 1px solid #454552; border-radius: 7px; cursor: pointer; align-self: end; }
    .load input, .pgn-box textarea {
      flex: 1; padding: .42rem .6rem; border-radius: 7px;
      background: #16161b; color: var(--text); border: 1px solid var(--line);
      font-family: ui-monospace, monospace; font-size: .74rem;
    }
    .import-actions { display: flex; flex-direction: column; gap: .4rem; }
    .file-button { display: inline-flex; align-items: center; justify-content: center; padding: .5rem 1rem; background: #2a2a33; color: #e9e9ee; border: 1px solid #454552; border-radius: 7px; cursor: pointer; font-size: .82rem; }
    .file-button input { display: none; }
    .recent-files { display: flex; flex-direction: column; gap: .15rem; margin-bottom: .6rem; }
    .link {
      background: none; border: none; color: var(--accent);
      font-size: .76rem; cursor: pointer; padding: 0; text-align: left;
    }
    .link:hover { text-decoration: underline; }
    .pgn-box { display: flex; flex-direction: column; gap: .4rem; }
    .pgn-box textarea { min-height: 90px; resize: vertical; }

    .fen-line { display: flex; gap: .5rem; align-items: baseline; }
    .fen-line code {
      font-size: .68rem; color: #8fb8d8; word-break: break-all; line-height: 1.35;
    }
    .status { font-size: .78rem; color: var(--accent); min-height: 1.1em; }

    @media (max-width: 900px) {
      body { padding: 1rem; }
      .layout { grid-template-columns: 1fr; max-width: 560px; }
    }
  
    /* ---- RustyBrickChess app shell ---- */
    body { margin: 0; padding: 0; display: block; background: #141418; color: #e9e9ee; }
    .app { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
    .sidebar { background: #121216; border-right: 1px solid #2a2a33; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .brand { font-weight: 700; font-size: 1rem; }
    nav { display: flex; flex-direction: column; gap: .25rem; }
    .nav { text-align: left; background: none; border: none; color: #b9b9c4; padding: .5rem .6rem; border-radius: 6px; cursor: pointer; font-size: .9rem; }
    .nav:hover { background: #23232b; }
    .nav.active { background: #2f4a35; color: #eaf5ec; }
    .side-foot { margin-top: auto; font-size: .7rem; color: #6f6f7a; }
    .main { padding: 1.2rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    .topbar { display: flex; gap: .6rem; align-items: center; }
    .topbar input { width: 280px; padding: .5rem .7rem; border-radius: 7px; background: #1c1c22; color: #e9e9ee; border: 1px solid #31313c; }
    .topbar button, .engine-pane button { padding: .5rem .8rem; background: #2a2a33; color: #e9e9ee; border: 1px solid #454552; border-radius: 7px; cursor: pointer; }
    .status { font-size: .8rem; color: #9fd39f; }
    .panel { background: #1c1c22; border: 1px solid #31313c; border-radius: 12px; padding: 1rem; }
    .panel-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .6rem; }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .muted { color: #9a9aa8; font-size: .8rem; }
    .panel-sub { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: #9a9aa8; margin-top: 1rem; }
    .import { display: grid; grid-template-columns: 1fr auto; gap: .6rem; margin-bottom: .8rem; }
    .import textarea { min-height: 70px; resize: vertical; background: #16161b; color: #e9e9ee; border: 1px solid #31313c; border-radius: 7px; padding: .5rem; font-family: ui-monospace, monospace; font-size: .75rem; }
    .import button { padding: .5rem 1rem; background: #2f4a35; color: #eaf5ec; border: 1px solid #3f5f45; border-radius: 7px; cursor: pointer; }
    .table { display: flex; flex-direction: column; gap: 2px; }
    .row { display: grid; grid-template-columns: 3rem 1.2fr 1.2fr .6fr 1fr; gap: .5rem; padding: .35rem .5rem; border-radius: 5px; text-align: left; }
    .row.head { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: #9a9aa8; }
    .row.game { background: #202028; border: none; color: #e9e9ee; cursor: pointer; font-size: .85rem; }
    .row.game:hover { background: #2a2a33; }
    .analysis { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1.2rem; align-items: start; }
    .analysis .layout { grid-template-columns: minmax(0, 1fr) 270px; gap: .9rem; max-width: none; }
    .engine-pane { background: #1c1c22; border: 1px solid #31313c; border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; gap: .7rem; }
    .eval-card { display: flex; align-items: baseline; gap: .7rem; }
    .eval-score { font-size: 2rem; font-weight: 700; }
    .engine-body { display: flex; flex-direction: column; gap: .3rem; }
    .best { color: #9fd39f; }
    .pv { font-family: ui-monospace, monospace; font-size: .78rem; color: #c8c8d2; word-break: break-all; }

    /* ---- engine dialog, console and assistant dock ---- */
    .engine-row { flex-wrap: wrap; }
    .engine-dialog { border: 1px solid #3f5f45; background: #1a211c; border-radius: 10px; padding: .8rem; display: flex; flex-direction: column; gap: .55rem; margin-top: .6rem; }
    .engine-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .5rem; }
    .engine-fields label { display: flex; flex-direction: column; gap: .2rem; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .engine-fields input, .engine-fields select { padding: .4rem .55rem; border-radius: 6px; background: #16161b; color: var(--text); border: 1px solid var(--line); font-size: .78rem; }
    .engine-test { font-size: .8rem; }
    .error { color: #ff9b9b; }
    .engine-dock { position: fixed; top: 0; right: 0; bottom: 0; width: 390px; max-width: 92vw; background: #17171d; border-left: 1px solid #31313c; box-shadow: -18px 0 40px rgba(0,0,0,.5); z-index: 90; display: flex; flex-direction: column; }
    .dock-head { display: flex; justify-content: space-between; align-items: center; padding: .6rem .8rem; border-bottom: 1px solid #31313c; }
    .dock-tabs { display: flex; gap: .3rem; }
    .dock-tab { background: none; border: 1px solid #31313c; color: #b9b9c4; padding: .3rem .7rem; border-radius: 6px; cursor: pointer; font-size: .8rem; }
    .dock-tab.active { background: #2f4a35; color: #eaf5ec; border-color: #3f5f45; }
    .dock-close { background: none; border: none; color: #9a9aa8; font-size: 1.2rem; cursor: pointer; }
    .dock-body { display: flex; flex-direction: column; gap: .6rem; padding: .8rem; min-height: 0; flex: 1 1 auto; }
    .chat-messages { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: .45rem; }
    .chat-msg { padding: .45rem .6rem; border-radius: 8px; font-size: .82rem; background: #202028; white-space: pre-wrap; }
    .chat-msg.user { background: #2a3a2f; align-self: flex-end; }
    .chat-msg.error { background: #3a2424; color: #ffb3b3; }
    .chat-tools { display: flex; gap: .25rem; flex-wrap: wrap; }
    .tool-chip { font-size: .68rem; background: #2a2a33; border: 1px solid #454552; border-radius: 999px; padding: .1rem .5rem; color: #9fd39f; }
    .chat-input { display: flex; gap: .4rem; }
    .chat-input textarea, .chat-input input { flex: 1; background: #16161b; color: var(--text); border: 1px solid #31313c; border-radius: 7px; padding: .45rem .6rem; font-size: .8rem; }
    .chat-input textarea { min-height: 64px; resize: vertical; }
    .console-log { flex: 1 1 auto; overflow-y: auto; background: #0f0f13; border: 1px solid #31313c; border-radius: 8px; padding: .55rem; font-family: ui-monospace, monospace; font-size: .72rem; white-space: pre-wrap; margin: 0; }

    /* ---- practice ---- */
    .practice { display: flex; flex-direction: column; gap: .8rem; min-height: 0; }
    .practice-controls { padding: .7rem .9rem; }
    .practice-controls .row-btns { margin-top: 0; }
    .practice-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; }
    .practice-row input, .practice-row select { padding: .42rem .6rem; border-radius: 7px; background: #16161b; color: var(--text); border: 1px solid var(--line); font-size: .8rem; }
    .practice-row input { flex: 1; min-width: 240px; }
    .practice-row button { padding: .42rem .75rem; background: #2a2a33; color: var(--text); border: 1px solid #454552; border-radius: 7px; cursor: pointer; }
    .mode { background: #1c1c22; color: var(--muted); border: 1px solid var(--line); padding: .4rem .8rem; border-radius: 7px; cursor: pointer; }
    .mode.active { background: #2f4a35; color: #eaf5ec; border-color: #3f5f45; }
    .practice-board { flex: 1 1 auto; min-height: 0; }
    .practice-stats { font-size: 1.1rem; font-weight: 600; }
    .match-moves { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; font-family: ui-monospace, monospace; font-size: .8rem; }
    .match-move { display: grid; grid-template-columns: 2.2rem 1fr 1fr; gap: .4rem; }

    /* ---- workspaces + home ---- */
    .workspaces { display: flex; align-items: center; gap: .35rem; flex: 0 0 auto; overflow-x: auto; overflow-y: hidden; padding-bottom: .15rem; }
    .ws-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: #6f6f7a; margin-right: .2rem; }
    .ws-tab { display: flex; align-items: stretch; border: 1px solid #31313c; border-radius: 7px; background: #1c1c22; overflow: hidden; max-width: 260px; flex: 0 0 auto; }
    .ws-tab.active { border-color: #3f5f45; background: #24312a; }
    .ws-name { background: none; border: none; color: #b9b9c4; font-size: .76rem; padding: .3rem .55rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ws-tab.active .ws-name { color: #eaf5ec; }
    .ws-close { background: none; border: none; border-left: 1px solid #31313c; color: #7f7f8c; cursor: pointer; padding: 0 .45rem; font-size: .85rem; }
    .ws-close:hover { background: #3a2a2a; color: #ffb3b3; }
    .ws-new { background: #1c1c22; border: 1px dashed #454552; color: #b9b9c4; border-radius: 7px; padding: .3rem .5rem; font-size: .76rem; cursor: pointer; flex: 0 0 auto; }
    .ws-kind { font-size: .58rem; letter-spacing: .06em; color: #9fd39f; background: #24312a; border-right: 1px solid #31313c; padding: .35rem .35rem; }
    .ws-kind.kind-database { color: #9fc5e8; background: #1d2733; }
    .ws-kind.kind-openings { color: #e8d29f; background: #2f2a1d; }
    .ws-kind.kind-puzzles { color: #e8a0c5; background: #2f1d27; }
    .ws-icon { background: none; border: none; border-left: 1px solid #31313c; color: #7f7f8c; cursor: pointer; padding: 0 .3rem; font-size: .78rem; }
    .ws-icon:hover { color: #e9e9ee; background: #2a2a33; }
    .ws-rename { background: #101014; color: #e9e9ee; border: 1px solid #3f5f45; border-radius: 0; padding: .25rem .4rem; font-size: .76rem; width: 9rem; }
    .ws-new:hover { color: #e9e9ee; border-color: #6f6f7a; }

    .home { display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; min-height: 0; padding-right: .2rem; }
    .home-hero { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
    .home-greeting { margin: .15rem 0 .3rem; font-size: 1.35rem; }
    .home-hero-actions { display: flex; gap: .5rem; align-items: center; }
    .home-hero-actions input { padding: .5rem .7rem; border-radius: 7px; background: #16161b; color: #e9e9ee; border: 1px solid #31313c; width: 190px; }
    .home-hero-actions button { padding: .5rem .9rem; background: #2f4a35; color: #eaf5ec; border: 1px solid #3f5f45; border-radius: 7px; cursor: pointer; }
    .accounts { display: flex; flex-direction: column; gap: .6rem; }
    .account-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: .8rem; }
    .account-card { background: #16161b; border: 1px solid #31313c; border-radius: 9px; padding: .7rem .8rem; display: flex; flex-direction: column; gap: .45rem; }
    .account-head { display: flex; justify-content: space-between; align-items: baseline; }
    .account-name { font-weight: 700; }
    .account-form { display: flex; gap: .4rem; flex-wrap: wrap; }
    .account-form input { flex: 1; min-width: 130px; padding: .42rem .55rem; border-radius: 6px; background: #101014; color: var(--text); border: 1px solid var(--line); font-size: .78rem; }
    .account-form button, .account-card .row-btns button { padding: .4rem .7rem; background: #2a2a33; color: var(--text); border: 1px solid #454552; border-radius: 7px; cursor: pointer; }
    .account-actions { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; }
    .account-actions label { display: flex; gap: .35rem; align-items: center; font-size: .72rem; color: var(--muted); }
    .account-actions input { width: 5rem; padding: .3rem .4rem; border-radius: 6px; background: #16161b; color: var(--text); border: 1px solid var(--line); }
    .home-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; }
    .home-stat { background: #1c1c22; border: 1px solid #31313c; border-radius: 10px; padding: .8rem 1rem; }
    .home-stat-value { font-size: 1.5rem; font-weight: 700; }
    .home-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
    .home .row.game { grid-template-columns: 2.4rem 1fr 1fr .6rem 1.1fr; }
