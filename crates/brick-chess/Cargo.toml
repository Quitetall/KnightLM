[package]
name = "brick-chess"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"
description = "A reusable, renderer-agnostic chess widget with a JSON command/event protocol."

[[bin]]
name = "brick-chess"
path = "src/bin/brick-chess.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
shakmaty.workspace = true
knightlm-core = { path = "../core" }
knightlm-notation = { path = "../notation" }
