[package]
name = "rbc-ai"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "AGPL-3.0-only"
description = "Assistant domain: sessions, tools, providers, matches, ratings and approvals."

[features]
default = ["protocol"]
protocol = []
core = ["protocol", "dep:knightlm-core", "dep:shakmaty", "dep:anyhow"]
provider = ["core", "dep:ureq", "dep:sha2"]
host = ["provider", "dep:rbc-db"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow = { workspace = true, optional = true }
rbc-db = { path = "../rbc-db", optional = true }
knightlm-core = { path = "../core", optional = true }
shakmaty = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
