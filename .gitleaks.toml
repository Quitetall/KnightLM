# Secret-scan policy, enforced by the `secret-scan` job in
# .github/workflows/ci.yml and locally by `make check-secrets`.
title = "KnightLM secret scan"

[extend]
useDefault = true

[allowlist]
description = "Machine-written records and fixtures: their high-entropy strings are hashes, ids and chess positions, never credentials"
paths = [
    '''docs/(tickets|warrants)/.*journal\.jsonl$''',
    '''docs/.*/checks/.*''',
    '''docs/generated/.*''',
    '''model/eval/fixtures/.*''',
    '''Cargo\.lock$''',
]
regexes = [
    # A model name that the generic-key rule mistakes for a key.
    '''qwen3_5-0\.8b''',
]
